  <circle cx="360" cy="260" r="68" fill="#24292f" opacity="0.93"/>
  <circle cx="440" cy="158" r="38" fill="#fff8c5" stroke="#bf8700" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="405" y="126" font-size="11" class="muted">3/7 satellite component</text>
  <text x="405" y="141" font-size="10" class="muted">(outline schematic)</text>
  <path d="M840 118 C760 110 650 120 468.8 184.4" fill="none" stroke="#bf8700" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M856 392 C770 390 620 330 468.8 184.4" fill="none" stroke="#bf8700" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="468.8" cy="184.4" r="7" fill="#cf222e" stroke="#ffffff" stroke-width="2"/>
  <text x="482" y="177" font-size="12" font-weight="700">common landing point = bulb root</text>
  <text x="482" y="195" font-size="11" class="muted">c ≈ −0.606357 + 0.412400i</text>
  <text x="758" y="106" font-size="11" class="schem">parameter rays θ₋, θ₊</text>
  <text x="758" y="121" font-size="10" class="muted">(paths schematic)</text>

  <rect x="418" y="410" width="442" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="434" y="433" font-size="12" font-weight="700">The map is not “q cycle points → q bulb points.”</text>
  <text x="434" y="453" font-size="11">The q-cycle determines the characteristic pair. Those two external parameter rays</text>
  <text x="434" y="470" font-size="11">land together at one root; the region between them is the wake.</text>
</svg>