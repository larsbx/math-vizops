<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Wake cycle to Mandelbrot bulb root for internal angle 3/7</title>
  <desc id="desc">The exact doubling cycle modulo one has characteristic angles 41/127 and 42/127. Imported rational ray landing identifies their parameter rays as landing together at the root of the 3/7 satellite component on the main cardioid. The ray traces and satellite outline are schematic.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#24292f}
      .muted{fill:#57606a}.exact{fill:#0969da}.imported{fill:#8250df}.schem{stroke:#bf8700}
    </style>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="32" y="34" font-size="20" font-weight="700">3/7 wake: exact angle cycle → Mandelbrot parameter plane</text>
  <text x="32" y="57" class="muted" font-size="12">Exact finite arithmetic is blue; the ray-landing interpretation is imported; drawn ray paths and the satellite outline are schematic.</text>

  <text x="36" y="100" font-size="15" font-weight="700">1. Exact doubling cycle in ℚ/ℤ</text>
  <circle cx="178" cy="264" r="112" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <path d="M178 152 L266 194 L288 289 L227 359 L129 365 L69 290 L91 194 Z" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="178" cy="152" r="15" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="178" y="157" text-anchor="middle" font-size="10">21</text>
  <circle cx="266" cy="194" r="15" fill="#fff8c5" stroke="#bf8700" stroke-width="3"/><text x="266" y="199" text-anchor="middle" font-size="10">42</text>
  <circle cx="288" cy="289" r="15" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="288" y="294" text-anchor="middle" font-size="10">84</text>
  <circle cx="227" cy="359" r="15" fill="#fff8c5" stroke="#bf8700" stroke-width="3"/><text x="227" y="364" text-anchor="middle" font-size="10">41</text>
  <circle cx="129" cy="365" r="15" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="129" y="370" text-anchor="middle" font-size="10">82</text>
  <circle cx="69" cy="290" r="15" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="69" y="295" text-anchor="middle" font-size="10">37</text>
  <circle cx="91" cy="194" r="15" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="91" y="199" text-anchor="middle" font-size="10">74</text>
  <text x="178" y="260" text-anchor="middle" font-size="13" font-weight="700">×2 mod 127</text>
  <text x="178" y="280" text-anchor="middle" class="muted" font-size="11">orbit order</text>
  <rect x="45" y="408" width="270" height="67" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="431" font-size="12"><tspan font-weight="700">Angular order:</tspan> 21, 37, 41, 42, 74, 82, 84</text>
  <text x="60" y="451" class="exact" font-size="12" font-weight="700">θ₋ = 41/127,  θ₊ = 42/127</text>
  <text x="60" y="469" class="exact" font-size="11">characteristic width = 1/127</text>

  <path d="M330 253 C360 253 380 253 405 253" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="367" y="226" text-anchor="middle" font-size="11" class="imported">[DH/Mil00]</text>
  <text x="367" y="242" text-anchor="middle" font-size="10" class="muted">parameter-ray landing</text>

  <text x="418" y="100" font-size="15" font-weight="700">2. Standard quadratic parameter plane</text>
