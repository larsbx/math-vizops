name: Render and publish animation gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animation-gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: math-vizops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: larsbx/finite-mandelbrot-research
          path: finite-mandelbrot-research
          token: ${{ secrets.ESTATE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: larsbx/pisot-substitution-conjecture-research
          path: pisot-substitution-conjecture-research
          token: ${{ secrets.ESTATE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: larsbx/mandelbrot-bulbs-and-ford-circles-research
          path: mandelbrot-bulbs-and-ford-circles-research
          token: ${{ secrets.ESTATE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: larsbx/finite-math-kernels
          path: finite-math-kernels
          token: ${{ secrets.ESTATE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libpango1.0-dev ffmpeg xvfb xauth libgl1-mesa-dri libegl1 fonts-dejavu-core
      - name: Install conformance dependencies
        working-directory: math-vizops
        run: pip install -e '.[test]'
      - name: Verify sources and conformance
        working-directory: math-vizops
        env:
          VIZOPS_REQUIRE_SOURCES: '1'
        run: |
          python -m vizops --check
          python -m vizops --sources ..
          VIZOPS_SOURCES=.. pytest -q
      - name: Install tested ManimGL runtime
        run: pip install manimgl==1.7.2
      - name: Render, verify, and embed all registered scenes
        working-directory: math-vizops
        run: xvfb-run -a python -m vizops gallery --sources .. --quality medium --out dist --report publication-report.json
      - name: Keep machine-readable build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-publication-report
          path: math-vizops/publication-report.json
          if-no-files-found: warn
      - name: Reviewable gallery bundle
        uses: actions/upload-artifact@v4
        with:
          name: animation-gallery-${{ github.sha }}
          path: math-vizops/dist
          if-no-files-found: error
      - name: Stage generated gallery for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: math-vizops/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy only the verified generated gallery
        id: deployment
        uses: actions/deploy-pages@v4
