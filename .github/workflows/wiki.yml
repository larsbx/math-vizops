name: wiki

# Deliberately its own workflow, not a job inside ci.yml: a manual dispatch
# used to test or re-publish the wiki must not also schedule ci.yml's other
# jobs. `estate` in particular checks out two sibling repositories and is
# documented to fail when ESTATE_TOKEN lacks access to them -- unrelated to
# the wiki, but GitHub runs every unguarded job in a workflow on every trigger
# that fires it, workflow_dispatch included. Isolating the wiki job in its own
# workflow means a wiki-only dispatch runs only the wiki job, full stop.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    # The wiki is a derived surface: `wiki/` in this repository is the source,
    # and this job mirrors it outward. GITHUB_TOKEN cannot push to a wiki, so
    # the job needs a WIKI_TOKEN_AND_AGENT_ASSISTANTS secret with repo write
    # access; without one it says so and the wiki is published from a
    # developer's machine instead (`python -m vizops wiki --publish`).
    #
    # A wiki repository exists only once wikis are enabled for the repository
    # and its first page has been created; until then this job reports that.
    #
    # workflow_dispatch lets a run be pointed at any ref, so the branch guard
    # stays explicit rather than assumed from the trigger.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN_AND_AGENT_ASSISTANTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[test]'
      - name: no generated block has drifted, before publishing any of them
        run: python -m vizops --check
      - name: mirror wiki/ to the GitHub wiki
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "No WIKI_TOKEN_AND_AGENT_ASSISTANTS secret is set, so this job cannot push to the wiki."
            echo "Publish from a checkout instead: python -m vizops wiki --publish"
            exit 0
          fi
          # The credential goes in git config rather than in the remote URL, so
          # a git error message cannot quote the token back into the log.
          git config --global url."https://x-access-token:$WIKI_TOKEN@github.com/".insteadOf "https://github.com/"
          python -m vizops wiki --publish --remote "https://github.com/${{ github.repository }}.wiki.git"
