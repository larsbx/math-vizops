name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: every vendored file matches its pin in vendored.toml
        run: python vendor/python/vendoring/check_vendored_sync.py
      - run: pip install -e '.[test]'
      - name: no generated block in the README or the wiki has drifted
        run: python -m vizops --check
      - run: pytest -q

  estate:
    # Match the Pages pipeline: PR checks do not receive sibling credentials.
    if: github.event_name != 'pull_request'
    # The scenes against the real artifacts. This is what catches an upstream
    # generator changing shape -- a new provenance class, a renamed taxonomy,
    # an edge type that was never declared -- so the checkouts are required
    # rather than optional: VIZOPS_REQUIRE_SOURCES turns a missing one into a
    # failure instead of a skip.
    #
    # Private siblings need a token with read access to them; `github.token`
    # cannot see another repository. Set the ESTATE_TOKEN secret if the checkout
    # step fails with "Repository not found".
    runs-on: ubuntu-latest
    env:
      # Cross-repository private checkouts require the explicitly scoped PAT.
      # github.token is deliberately not used as a fallback: it cannot read a
      # private sibling and turns an otherwise useful estate run into a 404.
      VIZOPS_REQUIRE_SOURCES: ${{ secrets.ESTATE_TOKEN != '' && '1' || '0' }}
      VIZOPS_HAVE_ESTATE_TOKEN: ${{ secrets.ESTATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: math-vizops
      - uses: actions/checkout@v4
        with:
          repository: larsbx/finite-mandelbrot-research
          path: finite-mandelbrot-research
          token: ${{ secrets.ESTATE_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: larsbx/pisot-substitution-conjecture-research
          path: pisot-substitution-conjecture-research
          token: ${{ secrets.ESTATE_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: env.VIZOPS_HAVE_ESTATE_TOKEN == 'true'
        with:
          repository: larsbx/mandelbrot-bulbs-and-ford-circles-research
          path: mandelbrot-bulbs-and-ford-circles-research
          token: ${{ secrets.ESTATE_TOKEN }}
      - uses: actions/checkout@v4
        if: env.VIZOPS_HAVE_ESTATE_TOKEN == 'true'
        with:
          repository: larsbx/finite-math-kernels
          path: finite-math-kernels
          token: ${{ secrets.ESTATE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: math-vizops
        run: pip install -e '.[test]'
      - name: every scene reads, transcribes and lays out its real artifact
        working-directory: math-vizops
        run: |
          python -m vizops
          pytest tests/test_estate.py -q
          if [ -d ../mandelbrot-bulbs-and-ford-circles-research ]; then
            python -m vizops page wake-to-mandelbrot bulbs-and-ford-circles
          fi
