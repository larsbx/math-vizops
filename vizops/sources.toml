# Every artifact vizops draws, and nothing else.
#
# `path` names a MACHINE-READABLE surface that its own repository generates and
# checks. vizops reads that surface and never the mathematics behind it: the
# derivation of a status, a closure or a taxonomy belongs to the repository
# that owns it, and re-deriving one here would produce a second answer to a
# question that already has one. If a figure needs a fact no artifact carries,
# the fix is upstream, in the generator.
#
# A checkout is not pinned by digest. vizops draws whatever the checkout says
# today and stamps that digest on the frame, so a frame is a statement about
# one revision rather than a claim that the revision is current; a picture of a
# moving artifact is supposed to move.
#
# The one exception is code vizops executes rather than reads. An entry with
# `vendored = "<package>"` calls that package's byte-for-byte copy under
# vendor/python/, pinned to one upstream commit and digest per file in
# `vendored.toml` (checked in CI by vendor/python/vendoring/check_vendored_sync.py);
# every pinned file is checked where Python imported it, and a drifted copy is
# refused. `repo` and `path` name the upstream package directory it was copied
# from, and the stamped digest covers its whole pinned file set. Today that is finite-math-kernels'
# `rational_dynamics_py`, which the wake scene and page call.

format = "vizops sources 1"

[[scene]]
id = "c1-claim-graph"
title = "C1 claim relationship graph"
repo = "larsbx/finite-mandelbrot-research"
path = "docs/C1_claim_relationship_graph.json"
adapter = "typed_graph"
scene = "ClaimGraph"
note = "Generated from ledger.json by proof_records/generate_ledgers.py; the status label and the provenance class are that generator's, not this one's."

[[scene]]
id = "psc-object-catalogue"
title = "PSC mathematical-object catalogue"
repo = "larsbx/pisot-substitution-conjecture-research"
path = "docs/catalogues/mathematical_objects.toml"
adapter = "object_catalogue"
scene = "ObjectCatalogue"
note = "The single machine-readable source of docs/mathematical-object-catalogue.md."

[[scene]]
id = "wake-cycle-3-7"
title = "3/7 wake cycle to Mandelbrot bulb root"
repo = "larsbx/finite-math-kernels"
path = "oracles/rational_dynamics_py"
vendored = "rational_dynamics_py"
adapter = "wake_module"
scene = "WakeCycleToMandelbrot"
note = "Exact cycle data for p/q = 3/7 are the vendored rational_dynamics_py's (ported from the bulbs repository's kernel/bulbford/wake.py); the root coordinate is a numerical display aid and the rational parameter-ray landing relation is the imported [DH/Mil00]."

# A page is a self-contained HTML surface rather than a manim scene, built by
# `builder` (a package under vizops/). Its source is code the owning repository
# runs -- an emitter, a module -- not a file it commits, so `path` names that
# code, and `task` the pixi task that runs it where there is one.

[[page]]
id = "mandelbrot-atlas"
title = "Ray address atlas"
repo = "larsbx/finite-mandelbrot-research"
path = "kernel/mojo/entrypoints/atlas_dataset.mojo"
builder = "atlas"
artifact = "https://claude.ai/artifact/9LDj75kM1AFBjZLmDxuFgA"
task = "atlas-dataset"
note = "The exact sections are that emitter's, checked against the Python oracles by tests/test_atlas_dataset.py; the positions are traced by vizops/atlas/trace.py and are a placement, not a claim."

[[page]]
id = "wake-to-mandelbrot"
title = "Wake cycle to Mandelbrot bulb root"
repo = "larsbx/finite-math-kernels"
path = "oracles/rational_dynamics_py"
vendored = "rational_dynamics_py"
builder = "wake"
note = "Rotation words, doubling cycles and characteristic pairs are the vendored rational_dynamics_py's (ported from the bulbs repository's kernel/bulbford/wake.py); the raster, the root coordinate and the dashed rays are display aids. The landing relation is the imported [DH/Mil00]."

[[page]]
id = "bulbs-and-ford-circles"
title = "Bulbs & Ford Circles"
repo = "larsbx/mandelbrot-bulbs-and-ford-circles-research"
path = "experiments/data/center_certificates.json"
builder = "bulbs"
artifact = "https://claude.ai/artifact/X6cYWjyUe8VZLRL75dorKh"
also = [
  "larsbx/mandelbrot-bulbs-and-ford-circles-research:experiments/data/antipode_certificates.json",
  "larsbx/mandelbrot-bulbs-and-ford-circles-research:experiments/data/kappa_q1009.json",
  "larsbx/finite-math-kernels:conformance/cyclotomic_germ_v1.json",
]
note = "Certified centre and antipode boxes, G brackets and the q = 1009 sweep are that repository's; the exact indices are finite-math-kernels' cyclotomic germ vectors. The page transcribes them; every certificate it shows was issued upstream."

[[page]]
id = "psc-rauzy-representability"
title = "PSC Rauzy representability"
repo = "larsbx/pisot-substitution-conjecture-research"
path = "docs/rauzy-representability-2026-10-08.html"
builder = "rauzy"
artifact = "https://claude.ai/artifact/6gdPGTXbt68XLNdQ4KqSbt"
note = "The classification of the closed claims and the figures are that repository's page, copied byte for byte; it is an interpretive map with no ledger status there, and vizops adds only the stamp."

[[page]]
id = "mandelbrot-names-atlas"
title = "Mandelbrot Names Atlas"
repo = "larsbx/finite-mandelbrot-research"
path = "docs/structure_crosswalk.json"
builder = "crosswalk"
artifact = "https://claude.ai/artifact/GZGWVWFaFeBrE3Uy63PsnF"
note = "The names, exact keys, atlas relations and code occurrences are that repository's structure crosswalk, generated by tools/make_structure_crosswalk.py and checked against the atlas and the files it names; the angle circle draws the exact root angles at display positions. That a ray pair lands at a component is the imported landing theorem."
