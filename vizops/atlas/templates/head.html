<title>Ray Address Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eaeef2; --surface:#f8fafb; --raised:#ffffff;
  --ink:#10151b; --muted:#5a6675; --faint:#8b97a5; --rule:#ccd5de;
  --periodic:#0e6f6a; --periodic-soft:#4fa5a0;
  --preperiodic:#a8480d; --preperiodic-soft:#d08a4e;
  --plot-lo:#dfe6ec; --plot-mid:#7d95ab; --plot-hi:#2b3a49; --plot-in:#0b0f14;
  --certificate:#3d4f9c; --certificate-soft:#7f8ed0;
  --focus:#1668c2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0c1014; --surface:#141a21; --raised:#1a222b;
  --ink:#e3eaf1; --muted:#9aa7b4; --faint:#6b7885; --rule:#2a343f;
  --periodic:#43c2b8; --periodic-soft:#2a8b84;
  --preperiodic:#e89a55; --preperiodic-soft:#a86a32;
  --plot-lo:#10161c; --plot-mid:#3f5568; --plot-hi:#9db3c6; --plot-in:#05080b;
  --certificate:#8c9bdf; --certificate-soft:#4d5a9c;
  --focus:#5aa9f0;
}}
:root[data-theme="dark"]{
  --ground:#0c1014; --surface:#141a21; --raised:#1a222b;
  --ink:#e3eaf1; --muted:#9aa7b4; --faint:#6b7885; --rule:#2a343f;
  --periodic:#43c2b8; --periodic-soft:#2a8b84;
  --preperiodic:#e89a55; --preperiodic-soft:#a86a32;
  --plot-lo:#10161c; --plot-mid:#3f5568; --plot-hi:#9db3c6; --plot-in:#05080b;
  --certificate:#8c9bdf; --certificate-soft:#4d5a9c;
  --focus:#5aa9f0;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-0.01em;margin:0;text-wrap:balance}
h2{font-size:.95rem;font-weight:600;margin:0 0 10px;letter-spacing:-0.005em}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.lede{color:var(--muted);max-width:66ch;margin:10px 0 0;font-size:.92rem}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:22px}

.caveat{margin-top:16px;padding:12px 14px;border-left:3px solid var(--preperiodic);
  background:var(--surface);font-size:.84rem;color:var(--muted);max-width:74ch}
.caveat b{color:var(--ink);font-weight:600}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

.plotwrap{position:relative;background:var(--plot-in);border:1px solid var(--rule);
  border-radius:3px;overflow:hidden;aspect-ratio:6/5;max-width:100%}
canvas{display:block;width:100%;height:100%}
svg.marks{position:absolute;inset:0;width:100%;height:100%}
svg.marks circle,svg.marks rect{cursor:pointer}
h3{font-size:.8rem;font-weight:600;margin:28px 0 10px;letter-spacing:-0.005em}
section{margin-top:38px}
section>h2{font-size:1.05rem;margin-bottom:4px}
section>p.note{color:var(--muted);font-size:.88rem;margin:0 0 16px;max-width:70ch}
.circlewrap{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:10px}
svg.circle{display:block;width:100%;height:auto;max-width:460px;margin:0 auto}
svg.circle .ring{fill:none;stroke:var(--rule);stroke-width:1}
svg.circle .sep{stroke:var(--certificate);stroke-width:1.6}
svg.circle .bad{stroke:var(--preperiodic);stroke-width:.8;opacity:.42}
svg.circle .cyc{stroke:var(--preperiodic);stroke-width:2;opacity:.95}
svg.circle .vtx{cursor:pointer}
svg.incidence{display:block;width:100%;height:auto;margin:0 auto}
svg.incidence rect{rx:3}
svg.incidence text{font-family:"IBM Plex Mono",ui-monospace,monospace;fill:var(--ink)}
svg.incidence line{stroke:var(--rule);stroke-width:1.4}
svg.circle text{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;fill:var(--faint)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:14px}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{font:inherit;font-size:.78rem;color:var(--ink);background:var(--raised);
  border:1px solid var(--rule);border-radius:3px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--focus)}
button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

dl.rec{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.82rem}
dl.rec dt{color:var(--faint);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  align-self:baseline}
dl.rec dd{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;word-break:break-word}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;
  vertical-align:baseline}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:12px 0 0;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px;margin-top:34px}
.tablebox{border:1px solid var(--rule);border-radius:3px;background:var(--surface);overflow:hidden}
.tablehead{padding:12px 14px;border-bottom:1px solid var(--rule)}
.scroll{max-height:340px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.79rem}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--faint);font-weight:500;
  font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;z-index:1}
td.n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--raised)}
tbody tr[aria-selected="true"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--focus)}
.ok{color:var(--periodic);font-weight:500}
.formula{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.78rem;
  background:var(--raised);border:1px solid var(--rule);border-radius:3px;
  padding:9px 11px;margin:0 0 12px;overflow-x:auto;color:var(--ink)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:.8rem;color:var(--muted);max-width:74ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
